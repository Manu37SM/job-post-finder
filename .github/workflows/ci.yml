name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-secrets:
    name: No private files tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if session, config or generated data is tracked by git
        run: |
          bad=$(git ls-files | grep -E '^(config\.json|\.env|session-.*\.json|storage_state\.json|checkpoint\.json)$|^data/.*\.(xlsx|csv|txt|db)$|^data/(downloaded_images|debug)/|^logs/.*\.(log|csv)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Private/generated files are tracked by git:"
            echo "$bad"
            exit 1
          fi

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core

      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install tesseract --no-progress -y
          echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for the real-browser tests
        run: python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'

      - name: Install Chromium for the real-browser tests (Windows)
        run: python -m playwright install chromium
        if: runner.os == 'Windows'

      - name: Run tests (warnings are errors)
        run: python -m pytest -q -W error

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit
        run: pip-audit -r requirements.txt
